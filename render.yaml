services:
  - type: web
    name: mockly-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: GROQ_API_KEY
        sync: false          # You will fill this in Render dashboard
      - key: FRONTEND_URL
        sync: false          # e.g. https://mockly.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.0
